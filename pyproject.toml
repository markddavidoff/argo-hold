[project]
name = "argo-hold"
version = "0.1.0"
description = "Hold one Argo CD app's auto-sync off while a live change stays applied, then revert it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mark Davidoff" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/markddavidoff/argo-hold"
Issues = "https://github.com/markddavidoff/argo-hold/issues"

[tool.pytest.ini_options]
markers = ["k3d: needs a local k3d cluster with Argo CD (opt-in, ARGO_HOLD_K3D=1)"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
