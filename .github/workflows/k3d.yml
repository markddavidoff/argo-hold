name: k3d integration

# Opt-in integration tests against a throwaway k3d cluster with real Argo CD. Separate from
# CI: it needs docker and takes minutes, so it runs on a schedule and on demand, not on every
# push. See docs/k3d-findings.md for what these runs have observed.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k3d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Install k3d
        run: curl -sSfL https://raw.githubusercontent.com/k3d-io/k3d/v5.9.0/install.sh | TAG=v5.9.0 bash
      - name: Check kubectl is available
        run: kubectl version --client
      - name: Run the k3d integration tests
        run: make test-k3d
